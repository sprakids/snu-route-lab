<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하교길 아이콘 크기 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;font:16px/1.5 system-ui,'Malgun Gothic',sans-serif;background:#f3f6fa;color:#27313f}main{max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 24px;color:#687585}.preview{display:flex;gap:36px;margin-bottom:28px}.preview figure{margin:0}.preview img{width:192px;height:192px;border-radius:18%}figcaption{margin-top:8px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{padding:24px;border-radius:20px}.light{background:#fff;color:#27313f}.dark{background:#202224;color:#f2dda3}h2{margin:0 0 18px;font-size:18px}.size-grid{display:grid;grid-template-columns:78px repeat(3,1fr);gap:22px 16px;align-items:center;text-align:center}.size-grid img{display:block;margin:auto;object-fit:contain;border-radius:18%}.rowlabel{text-align:left}.small{font-size:14px;opacity:.8}@media(max-width:700px){body{padding:20px}.themes{grid-template-columns:1fr}.preview{gap:24px}.preview img{width:144px;height:144px}.size-grid{gap:20px 10px;grid-template-columns:66px repeat(3,1fr)}}
</style></head><body><main>

<span class="rowlabel">이전</span><img src="hagyogil-snu-home-icon-v1.png" width="32" height="32" alt="어두운 화면 이전 32픽셀"><img src="hagyogil-snu-home-icon-v1.png" width="48" height="48" alt="어두운 화면 이전 48픽셀"><img src="hagyogil-snu-home-icon-v1.png" width="64" height="64" alt="어두운 화면 이전 64픽셀">
<span class="rowlabel">새 구성</span><img src="hagyogil-snu-home-icon-v2.png" width="32" height="32" alt="어두운 화면 새 구성 32픽셀"><img src="hagyogil-snu-home-icon-v2.png" width="48" height="48" alt="어두운 화면 새 구성 48픽셀"><img src="hagyogil-snu-home-icon-v2.png" width="64" height="64" alt="어두운 화면 새 구성 64픽셀">
